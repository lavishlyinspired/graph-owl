# The gate, as CI runs it.
#
# Epic 16 Slice E requires that "generation runs on every PR so a contract
# change that breaks an SDK fails the build". Nothing else was running on a PR
# before this, so the workflow covers the rest of the gate too — the shape the
# repository has been running by hand since Epic 1.
#
# Jobs are split by what they need rather than by what they check: `rust` needs
# a toolchain and Docker, `sdks` needs Node and Python, and `contract` needs
# only the toolchain. Splitting them means a contract drift is reported as a
# contract drift and not as one failure among 1300 tests.

name: gate

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # A failing build should say what failed, not print a backtrace of cargo.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt, clippy and the workspace suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # `graph-owl-ui`'s `RustEmbed` derive reads `ui/dist` and
      # `graphowl-app/dist` at macro-expansion time and *fails to compile*
      # if either is absent — confirmed empirically (Plan 122a A0): moving
      # `ui/dist` aside and running `cargo check -p graph-owl-ui` produces
      # `error[E0277]: the trait bound "Assets: Embed" is not satisfied`.
      # Neither `dist/` is committed to git (both `.gitignore`s exclude it,
      # correctly — build output does not belong in source control), so
      # every job that touches `graph-owl-server` or `graph-owl-ui` needs a
      # real build of both frontends first, on every run, not just once to
      # warm `rust-cache`. `graphowl-app` is built with `VITE_BASE=/next/`
      # to match how `crates/graph-owl-ui` nests it in the real server
      # (`plans/122a-graphowl-app.md` A0) — a default-base build's asset
      # URLs would 404 once served under that prefix.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build ui/ (embedded by graph-owl-ui)
        run: cd ui && npm install --no-audit --no-fund && npm run build
      - name: build graphowl-app/ (embedded by graph-owl-ui under /next/)
        run: cd graphowl-app && npm install --no-audit --no-fund && VITE_BASE=/next/ npm run build

      - name: fmt
        run: cargo fmt --all -- --check

      # Seconds, and it has caught five real bugs — so it runs before the
      # expensive steps rather than after them. `#[serde(rename_all)]` on an
      # enum renames the VARIANTS, not the fields inside them, and most
      # variants have single-word fields that are immune by luck. See
      # `scripts/check-wire-casing.py` for the five, and for why the fix is a
      # per-field `rename` rather than `rename_all_fields`.
      - name: wire casing
        run: python3 scripts/check-wire-casing.py

      # Epic 37c Slice A: `graph-owl-core` and `graph-owl-api` stay
      # embeddable — no I/O dependency in `core`, no concrete backend
      # adapter in `api`, neither crate owns a runtime or reads the
      # environment. `cargo metadata --no-deps`, not a build, so it costs
      # nothing beyond the checkout already paid for.
      - name: embedding boundary
        run: python3 scripts/check-embedding-boundary.py

      # Epic 37c Slice E: `cargo publish --dry-run` never uploads (it "performs
      # all checks without uploading" per `cargo publish --help`) but it does
      # need every non-dev dependency's `version` to resolve against the real
      # crates.io index once specified — verified empirically 8 August 2026,
      # `cargo package` fails with "no matching package named `graph-owl-authz`
      # found" for any workspace crate that is not itself live yet. That makes
      # a genuine dry-run only achievable, right now, for `graph-owl-core`: it
      # is the one publishable crate with zero workspace dependencies. Every
      # crate meant to publish (core, storage, storage-memory, api) has
      # `version` alongside every internal `path` dependency so the manifests
      # are publish-ready, but `storage`/`storage-memory`/`api` cannot pass a
      # real dry-run until the crates they depend on are actually published —
      # that is a deliberate, separate release-ordering step, not something a
      # CI check can fake.
      - name: publish dry-run (graph-owl-core)
        run: cargo publish --dry-run -p graph-owl-core

      - name: clippy
        # `-A clippy::pedantic` and not a bare `-D warnings`. The workspace sets
        # `all = "warn", pedantic = "warn"` deliberately: pedantic is read as
        # advice here, not as policy, and a gate that denied it would fail on a
        # baseline nobody has decided to adopt. Denying everything *else* is a
        # gate that actually gates — it was zero when this workflow landed, and
        # keeping it zero is the point.
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::pedantic

      # `--test-threads=1` is not caution, it is required: the integration suite
      # shares one Postgres container and creates a database per test, and
      # concurrent creation intermittently fails with `PortNotExposed`. Measured
      # on this workspace; see CLAUDE.md.
      - name: tests
        run: cargo test --workspace --lib --tests -- --test-threads=1

      # Doc-tests are separated because they cost ~84 minutes on this workspace
      # against ~2.5 for the behavioural suite, and they catch a different class
      # of problem: an example that no longer compiles.
      - name: doc-tests
        run: cargo test --workspace --doc

  deny:
    name: dependency licences, advisories and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `00i-licensing.md`'s allowlist (MIT, Apache-2.0, BSD, ISC, Unicode,
      # Zlib) made structural — see `deny.toml` for the two documented,
      # narrow exceptions and why each exists. Its own header explains why
      # this was owed rather than optional: `00i` described the gate before
      # `deny.toml` or this job existed to run it.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  contract:
    name: the committed contract matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # This job runs the real `graph-owl-server` binary, which pulls in
      # `graph-owl-ui` — see the `rust` job's own comment on why both
      # frontend `dist/` dirs must be built here too.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build ui/ and graphowl-app/ (embedded by graph-owl-ui)
        run: |
          cd ui && npm install --no-audit --no-fund && npm run build && cd ..
          cd graphowl-app && npm install --no-audit --no-fund && VITE_BASE=/next/ npm run build

      # `openapi.json` is committed so a contract change shows up in a diff a
      # reviewer reads. Regenerating and comparing is what stops it becoming a
      # file nobody remembers to update.
      - name: regenerate and compare
        run: |
          cargo run -q -p graph-owl-server --bin openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json || {
            echo "::error::openapi.json is stale — regenerate: cargo run -p graph-owl-server --bin openapi > openapi.json"
            exit 1
          }

  public-api:
    name: graph-owl-api's public surface matches the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `cargo public-api` needs nightly for rustdoc JSON extraction — it
      # shells out to `+nightly` itself, so both toolchains are installed
      # but only `stable` is ever used to build the crate under test.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      # Epic 37c Slice F: `examples/embedded.rs` extending to a second
      # entity family (Epic 34's `Topic`/`MessagingService`) needed no new
      # public type — proved, not assumed, by diffing this snapshot before
      # and after the example changed. Committed so a real surface change
      # shows up in a PR diff a reviewer reads, the same reasoning
      # `openapi.json` above already uses. `-sss` omits blanket/auto-trait/
      # auto-derived impls, which are compiler-generated noise here, not a
      # surface a caller chose.
      - name: install cargo-public-api
        run: cargo install cargo-public-api --locked
      - name: regenerate and compare
        run: |
          cargo public-api -p graph-owl-api -sss > /tmp/public-api.txt
          diff -u crates/graph-owl-api/public-api.txt /tmp/public-api.txt || {
            echo "::error::crates/graph-owl-api/public-api.txt is stale — regenerate: cargo public-api -p graph-owl-api -sss > crates/graph-owl-api/public-api.txt"
            exit 1
          }

  sdks:
    name: SDKs generate and agree with the contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This job runs the real `graph-owl-server` binary — see the `rust`
      # job's comment on why both frontend `dist/` dirs must be built first.
      - name: build ui/ and graphowl-app/ (embedded by graph-owl-ui)
        run: |
          cd ui && npm install --no-audit --no-fund && npm run build && cd ..
          cd graphowl-app && npm install --no-audit --no-fund && VITE_BASE=/next/ npm run build

      - name: generate the contract
        run: cargo run -q -p graph-owl-server --bin openapi > openapi.json

      # **The drift criterion.** Generation runs here, so a contract change that
      # the generator cannot express fails the build rather than a customer's
      # next push.
      - name: generate the TypeScript type layer
        run: |
          cd sdk/typescript
          npm install --no-audit --no-fund
          npm run generate
          npm run typecheck

      - name: TypeScript SDK unit and contract tests
        run: cd sdk/typescript && npm test

      - name: Python SDK unit, contract and example tests
        run: |
          python -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/pip" install -q pytest
          cd sdk/python
          PYTHONPATH=. "$RUNNER_TEMP/sdk-venv/bin/pytest" -q

  sdk-roundtrip:
    name: both SDKs push at a live service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This job drives a real `graph-owl-server` binary — see the `rust`
      # job's comment on why both frontend `dist/` dirs must be built first.
      - name: build ui/ and graphowl-app/ (embedded by graph-owl-ui)
        run: |
          cd ui && npm install --no-audit --no-fund && npm run build && cd ..
          cd graphowl-app && npm install --no-audit --no-fund && VITE_BASE=/next/ npm run build

      # The only test that proves the contract *describes the service* rather
      # than merely being well-formed: generate a client from it and drive a
      # real server with it.
      - name: verify-sdks.sh
        run: bash scripts/verify-sdks.sh

  bolt-driver:
    name: a real Bolt driver against a live service (Epic 7d Slice F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This job builds and runs the real `graph-owl-server` binary — see
      # the `rust` job's comment on why both frontend `dist/` dirs must be
      # built first.
      - name: build ui/ and graphowl-app/ (embedded by graph-owl-ui)
        run: |
          cd ui && npm install --no-audit --no-fund && npm run build && cd ..
          cd graphowl-app && npm install --no-audit --no-fund && VITE_BASE=/next/ npm run build

      # Only this job builds with --features bolt — every other Rust job in
      # this workflow exercises the default (feature-off) build, which is
      # itself half of what this script asserts: the crate must not appear
      # in the dependency tree until this flag is on.
      - name: verify-bolt.sh
        run: bash scripts/verify-bolt.sh

  langchain-integration:
    name: graph-owl-langchain against a live service (Epic 43 Slice F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This job runs the real `graph-owl-server` binary — see the `rust`
      # job's comment on why both frontend `dist/` dirs must be built first.
      - name: build ui/ and graphowl-app/ (embedded by graph-owl-ui)
        run: |
          cd ui && npm install --no-audit --no-fund && npm run build && cd ..
          cd graphowl-app && npm install --no-audit --no-fund && VITE_BASE=/next/ npm run build

      # Same reasoning as sdk-roundtrip and bolt-driver: a mocked MCP server
      # tests this package's own opinion of the contract, not the contract
      # itself. This is the job that would have caught, in CI rather than by
      # hand, the isError-shape and RFC 9457-vs-JSON-RPC corrections this
      # package needed — see plans/43-framework-integrations.md.
      - name: verify-langchain.sh
        run: bash scripts/verify-langchain.sh

  ui:
    name: console typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: cd ui && npm install --no-audit --no-fund
      - name: build
        run: cd ui && npm run build
      - name: tests
        run: cd ui && npm test

  graphowl-app:
    # Plan 122a: the console rebuild that replaces `ui/`. Mirrors the `ui`
    # job above, plus lint (which `ui`'s job does not run — not reopened
    # here) and the budget check (`00f-ui-architecture.md`) as a build
    # failure, per A0's own acceptance criteria.
    name: graphowl-app typecheck, tests and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: cd graphowl-app && npm install --no-audit --no-fund
      - name: lint
        run: cd graphowl-app && npm run lint
      - name: typecheck and build
        run: cd graphowl-app && npm run build
      - name: tests
        run: cd graphowl-app && npm test
      - name: budgets
        run: cd graphowl-app && npm run check:budgets

  python-suites:
    name: connectors, worker and reco-now backend test suites
    # None of these three need Docker or a live graph-owl-server — each
    # tests HTTP behaviour against a local `http.server` double (the same
    # "a real local double, not a mock" discipline `test_loader.py` names),
    # not a running service. `examples/gst-reconcile`'s own tests are the
    # same shape but live under `examples/` — see the `examples` job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: connectors/python
        run: |
          python -m venv "$RUNNER_TEMP/connectors-venv"
          "$RUNNER_TEMP/connectors-venv/bin/pip" -q install -e "connectors/python[dev]"
          cd connectors/python && "$RUNNER_TEMP/connectors-venv/bin/pytest" -q

      # `[pdf,ovis-ocr2]` — some of this suite's own tests (e.g.
      # test_ocr.py's real `from PIL import Image`) need the optional
      # extras actually installed, not just the fallback-path tests that
      # deliberately poison sys.modules to test their absence.
      #
      # `graph-owl-sdk` is this workspace's own package, not published to
      # PyPI, so `workers/python`'s dependency on it only resolves once
      # `sdk/python` is installed first — found by running this step, not
      # by reading `workers/python/pyproject.toml` alone.
      - name: workers/python
        run: |
          python -m venv "$RUNNER_TEMP/workers-venv"
          "$RUNNER_TEMP/workers-venv/bin/pip" -q install -e sdk/python
          "$RUNNER_TEMP/workers-venv/bin/pip" -q install -e "workers/python[pdf,ovis-ocr2,dev]"
          cd workers/python && "$RUNNER_TEMP/workers-venv/bin/pytest" -q

      # requirements.txt's own `-e ../../../connectors/python` is relative
      # to this file's directory, so pip runs from inside it rather than
      # the repo root.
      - name: ext-apps/Reco backend
        run: |
          python -m venv "$RUNNER_TEMP/reco-venv"
          cd ext-apps/Reco/backend
          "$RUNNER_TEMP/reco-venv/bin/pip" -q install -r requirements.txt
          "$RUNNER_TEMP/reco-venv/bin/pytest" -q

  examples:
    name: reference applications (examples/) round-trip and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10

      # agent-triage, browse and adapter-csv (sdk/python) against a real
      # service — verify-sdks.sh/verify-langchain.sh's own reasoning: a
      # unit test of an example tests its own opinion of the API.
      - name: verify-examples.sh
        run: bash scripts/verify-examples.sh

      # examples/gst-reconcile needs no live service at all — scored
      # against packs/gst/eval/questions.md's answer key with a local
      # http.server double, the same zero-API-cost discipline
      # reconcile_agent.py's own docstring describes — so it runs as its
      # own lightweight step rather than inside the live-service script.
      - name: examples/gst-reconcile
        run: |
          python -m venv "$RUNNER_TEMP/gst-reconcile-venv"
          "$RUNNER_TEMP/gst-reconcile-venv/bin/pip" -q install pytest
          cd examples/gst-reconcile && "$RUNNER_TEMP/gst-reconcile-venv/bin/pytest" -q
