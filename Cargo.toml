[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tower = "0.5"
refinery = { version = "0.8", features = ["tokio-postgres"] }
tokio-postgres = "0.7"
# `reusable-containers` is what lets the whole workspace share one Postgres
# across test binaries *and* across runs, instead of starting one per test.
testcontainers-modules = { version = "0.11", features = ["postgres"] }
testcontainers = { version = "0.23", features = ["reusable-containers"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
dotenvy = "0.15"
sha2 = "0.10"
# Pattern constraints (Epic 5). MIT/Apache-2.0, and `00l-build-vs-adopt.md`
# is unambiguous here: a regex engine is the canonical thing to adopt.
regex = "1"
# Jaro-Winkler for name-similarity scoring (Epic 17 Slice C). MIT, already
# in the tree transitively (`darling_core`) — a string-metric function is
# not spec-governed the way a parser or reasoner is, so `00l` does not
# apply; it is small and well-known enough to adopt rather than reimplement.
strsim = "0.11"
# Webhook signature verification (Epic 18 Slice A). Both MIT/Apache-2.0.
# Hand-rolled HMAC/Ed25519 verification is the canonical security anti-pattern
# this rule exists to prevent — constant-time comparison is easy to get wrong
# and `hmac`'s own `verify_slice` already does it correctly; there is no
# "build" side to this decision.
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
utoipa = { version = "5", features = ["uuid", "chrono", "preserve_order"] }
graph-owl-core = { path = "crates/graph-owl-core" }
graph-owl-events = { path = "crates/graph-owl-events" }
graph-owl-storage = { path = "crates/graph-owl-storage" }
graph-owl-storage-postgres = { path = "crates/graph-owl-storage-postgres" }
graph-owl-authz = { path = "crates/graph-owl-authz" }
graph-owl-engine = { path = "crates/graph-owl-engine" }
graph-owl-engine-postgres = { path = "crates/graph-owl-engine-postgres" }
graph-owl-traversal = { path = "crates/graph-owl-traversal" }
graph-owl-api = { path = "crates/graph-owl-api" }
graph-owl-ui = { path = "crates/graph-owl-ui" }
graph-owl-connectors = { path = "crates/graph-owl-connectors" }
graph-owl-search = { path = "crates/graph-owl-search" }
