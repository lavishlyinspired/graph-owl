[workspace]
# The Cypher parser spike (Epic 7b Slice A, 4 Aug 2026) is a throwaway
# evaluation kept for reproducibility, not a component. Excluded so it never
# builds, gates, or appears in `cargo check --workspace` — its dependencies are
# candidates we evaluated, and three of the four were rejected.
exclude = ["spikes/cypher-parsers-2026-08"]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tower = "0.5"
refinery = { version = "0.8", features = ["tokio-postgres"] }
tokio-postgres = "0.7"
# `reusable-containers` is what lets the whole workspace share one Postgres
# across test binaries *and* across runs, instead of starting one per test.
testcontainers-modules = { version = "0.11", features = ["postgres"] }
testcontainers = { version = "0.23", features = ["reusable-containers"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
dotenvy = "0.15"
sha2 = "0.10"
# Pattern constraints (Epic 5). MIT/Apache-2.0, and `00l-build-vs-adopt.md`
# is unambiguous here: a regex engine is the canonical thing to adopt.
regex = "1"
# Jaro-Winkler for name-similarity scoring (Epic 17 Slice C). MIT, already
# in the tree transitively (`darling_core`) — a string-metric function is
# not spec-governed the way a parser or reasoner is, so `00l` does not
# apply; it is small and well-known enough to adopt rather than reimplement.
strsim = "0.11"
# Webhook signature verification (Epic 18 Slice A). Both MIT/Apache-2.0.
# Hand-rolled HMAC/Ed25519 verification is the canonical security anti-pattern
# this rule exists to prevent — constant-time comparison is easy to get wrong
# and `hmac`'s own `verify_slice` already does it correctly; there is no
# "build" side to this decision.
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
utoipa = { version = "5", features = ["uuid", "chrono", "preserve_order"] }
# Portable archive format (Epic 37b). MIT OR Apache-2.0, both maintained,
# both extremely widely used (`00l-build-vs-adopt.md`: a container/codec
# format is the canonical thing to adopt, not write) — checked 5 August
# 2026: `tar` 0.4.46 (203M downloads), `zstd` 0.13.3 (346M downloads).
tar = "0.4"
zstd = "0.13"
# RDF I/O (Epic 9). Already adopted in `00l-build-vs-adopt.md`; `oxrdf` is
# already in this tree transitively via `spargebra`/`spareval`. `oxttl`
# pins `oxrdf =0.3.3` exactly, matching the version already resolved here
# — confirmed 5 August 2026, MIT OR Apache-2.0, 1.1M downloads.
oxttl = "0.2"
# JSON-LD (Epic 9 Slice B). Same Oxigraph family as oxttl, same oxrdf
# =0.3.3 pin — confirmed 5 August 2026, MIT OR Apache-2.0, 649K downloads.
oxjsonld = "0.2"
# GraphML export (Epic 9a). MIT, 357M downloads, the de-facto standard
# Rust XML crate — checked 5 August 2026. Streaming `Writer` (not a DOM
# builder) is what "streaming, never build-then-write" (Epic 9a decision
# 5) needs, and its element/text API escapes automatically, the same
# "not the alternative it looks like" reasoning Epic 9 already recorded
# for hand-written Turtle: owning XML escaping by hand on one side of a
# round trip is exactly where such output silently corrupts.
quick-xml = "0.41"
graph-owl-core = { path = "crates/graph-owl-core" }
graph-owl-ontology = { path = "crates/graph-owl-ontology" }
graph-owl-events = { path = "crates/graph-owl-events" }
graph-owl-storage = { path = "crates/graph-owl-storage" }
graph-owl-storage-postgres = { path = "crates/graph-owl-storage-postgres" }
graph-owl-storage-memory = { path = "crates/graph-owl-storage-memory" }
graph-owl-authz = { path = "crates/graph-owl-authz" }
graph-owl-mcp = { path = "crates/graph-owl-mcp" }
graph-owl-lpg = { path = "crates/graph-owl-lpg" }
graph-owl-engine = { path = "crates/graph-owl-engine" }
graph-owl-engine-postgres = { path = "crates/graph-owl-engine-postgres" }
graph-owl-traversal = { path = "crates/graph-owl-traversal" }
graph-owl-api = { path = "crates/graph-owl-api" }
graph-owl-bolt = { path = "crates/graph-owl-bolt" }
graph-owl-ui = { path = "crates/graph-owl-ui" }
graph-owl-connectors = { path = "crates/graph-owl-connectors" }
graph-owl-search = { path = "crates/graph-owl-search" }

# ---------------------------------------------------------------------------
# Build-time profile tuning. Added after a session where the compile/test loop
# dominated wall clock; each setting below is a measured or mechanically
# obvious win, not a guess.
# ---------------------------------------------------------------------------

[profile.dev]
# Full DWARF is the single biggest linker input on macOS, and ~75 test
# binaries relink after any port change. `line-tables-only` keeps what is
# actually read — file and line in a panic backtrace — and drops the type
# and variable descriptions only an interactive debugger uses. A debugger
# session that needs them can build with `--profile dev-debug`.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are compiled once and then cached; their debug info is never
# stepped through and costs link time on every test binary that pulls them
# in. This is the setting that shrinks the ~63 MB `graph-owl-server` test
# rlib the mutation notes call out.
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# For the rare case a real debugger is needed: `cargo build --profile dev-debug`.
[profile.dev-debug]
inherits = "dev"
debug = true
