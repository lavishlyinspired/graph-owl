# Test-runner configuration — Epic 19 era.
#
# `cargo nextest` runs each test in its own process with a work-stealing
# scheduler, which is materially faster than `cargo test` on this workspace
# for two reasons specific to it: it never builds or runs doc-tests (84
# minutes on a full `cargo test --workspace`, zero behavioural coverage), and
# it does not serialise the whole run behind the slowest binary.

[profile.default]
# The container-backed integration tests dominate wall time and are I/O-bound
# on Docker, not CPU-bound — more concurrency here buys throughput rather
# than contention, which is the opposite of `cargo test`'s per-binary
# `--test-threads` knob this replaces.
test-threads = "num-cpus"
# A hung container wait should fail one test, not the run.
slow-timeout = { period = "60s", terminate-after = 4 }
fail-fast = false

# **The tests that must not run concurrently with each other.** Each creates
# a database on the shared Postgres server or asserts against a shared
# broker; running them in one group serialises exactly those, leaving every
# pure-logic test in the workspace free to run in parallel — which is what
# `cargo test -- --test-threads=1` could never express, since it serialises
# everything or nothing.
[test-groups]
containers = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(streaming) or binary(streaming_offsets) or binary(streaming_health) or binary(streaming_poison) or binary(streaming_rebalance)'
test-group = 'containers'

# `a_large_batch_commits_as_one_transaction` asserts that 8000 flakes span
# fewer than 5 transactions, measured via `pg_stat_database.xact_commit` —
# a **database-wide** counter that also counts the commits sqlx makes when
# establishing a pool connection. How many connections the pool opens
# depends on load, so under parallelism the count drifts past the threshold
# and the test reports "chunking broke atomicity" when chunking is fine.
# Verified both ways: it passes in 0.36s alone and failed at 6 commits in a
# parallel run.
#
# Serialised here rather than "fixed" by loosening the threshold, because
# the threshold is the assertion — raising it until it stops failing would
# throw away the only thing the test checks. The real fix is to count the
# transactions `assert_flakes` itself opens rather than infer them from a
# server-wide statistic, which belongs with whoever next touches that code.
[[profile.default.overrides]]
filter = 'binary(flake_roundtrip)'
test-group = 'containers'

# The kill-and-restart test deliberately waits out a Kafka consumer-group
# rebalance: dropping a consumer does not release its partitions until
# `session.timeout.ms` (45s by default) expires, so its replacement can sit
# unassigned for the better part of a minute before it is fed anything.
# That is the scenario under test, not slowness to be tuned away — it needs
# more headroom than the default 4x60s.
[[profile.default.overrides]]
filter = 'test(killing_the_consumer_before_a_commit_reprocesses_without_duplicating)'
slow-timeout = { period = "60s", terminate-after = 6 }
