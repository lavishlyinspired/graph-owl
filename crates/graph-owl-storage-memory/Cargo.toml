[package]
name = "graph-owl-storage-memory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "In-memory Storage implementation for embedding graph-owl without a database"
repository.workspace = true
keywords = ["knowledge-graph", "in-memory", "embedded"]

[lints]
workspace = true

[dependencies]
graph-owl-core.workspace = true
graph-owl-ontology = { path = "../graph-owl-ontology", version = "0.1.0" }
graph-owl-storage.workspace = true
graph-owl-authz.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
