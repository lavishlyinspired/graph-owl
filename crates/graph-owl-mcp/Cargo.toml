[package]
name = "graph-owl-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Model Context Protocol server for graph-owl"
repository.workspace = true
keywords = ["knowledge-graph", "mcp", "llm"]

[lints]
workspace = true

[dependencies]
graph-owl-core = { path = "../graph-owl-core", version = "0.1.0" }
graph-owl-api = { path = "../graph-owl-api", version = "0.1.0" }
graph-owl-storage = { path = "../graph-owl-storage", version = "0.1.0" }
# Epic 32: agent capabilities and grants.
graph-owl-authz = { path = "../graph-owl-authz", version = "0.1.0" }
# Epic 105 P10: the `traverse` tool's `Direction`/`Bounds` types — the same
# ones `Catalog::asset_subgraph` already takes, so the tool wraps the real
# signature rather than re-declaring a shadow of it.
graph-owl-traversal.workspace = true
# Epic 105 P10: `explain()`'s `Explanation`/`Chain`/`Budget` types — the
# same ones `Catalog::explain_fact` already takes and returns.
graph-owl-reasoning = { path = "../graph-owl-reasoning", version = "0.1.0" }
# 106 Slice 2: `query_graph`'s diagnostics render `SparqlOutcome.
# refused_axioms`, whose `ForbiddenConstruct` variants this crate matches on
# directly (`graph-owl-server`'s own `forbidden_construct_name` is the
# precedent this mirrors) — needs the type in scope, not just field access.
graph-owl-reasoning-ql = { path = "../graph-owl-reasoning-ql", version = "0.1.0" }
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# The recall tool works with memory ids to mark which results are disputed.
uuid.workspace = true
# Epic 14 Slice H: MCP's own types, protocol versions, and the stdio
# transport primitive.
#
# **`rmcp`, not `rust-mcp-schema`** — the 9 August 2026 re-measurement in
# `plans/00l-build-vs-adopt.md` found the 4 August spike had checked the
# wrong crate (`rust-mcp-sdk`, a different, unrelated third-party crate of a
# confusingly similar name). `rmcp` is the *official* SDK
# (`modelcontextprotocol` org), tracks a newer protocol revision than
# `rust-mcp-schema` did, and gates its transports behind independent feature
# flags — so `transport-io` (stdio) can be enabled without pulling in any of
# the HTTP-server weight (`reqwest`, `oauth2`, `aws-lc-sys`) the original
# `rust-mcp-sdk` spike rejected. `server` is required for `transport-io`'s
# `stdio()` function to be reachable at all; it already implies `schemars`.
rmcp = { version = "3", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }

[dev-dependencies]
chrono.workspace = true
