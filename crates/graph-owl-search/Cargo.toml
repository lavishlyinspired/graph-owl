[package]
name = "graph-owl-search"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "VectorIndex and TextIndex port traits for graph-owl"
repository.workspace = true
keywords = ["knowledge-graph", "vector-search", "search"]

[lints]
workspace = true

[dependencies]
graph-owl-core = { path = "../graph-owl-core", version = "0.1.0" }
async-trait.workspace = true
thiserror.workspace = true
# Embeddings only (`default-features = false`): chat, images, audio, and
# every other OpenAI API surface stay uncompiled. `rustls` matches the
# workspace's own `reqwest` TLS choice (`Cargo.toml`'s `rustls-tls`
# feature) rather than pulling in a second TLS backend.
async-openai = { version = "0.41", default-features = false, features = [
    "rustls",
    "embedding",
] }
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
