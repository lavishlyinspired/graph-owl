[package]
name = "graph-owl-rdf-io"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "JSON-LD, Turtle, N-Triples and RDF/XML import/export for graph-owl"
repository.workspace = true
keywords = ["knowledge-graph", "rdf", "json-ld"]

[lints]
workspace = true

[dependencies]
graph-owl-core = { path = "../graph-owl-core", version = "0.1.0" }
graph-owl-engine = { path = "../graph-owl-engine", version = "0.1.0" }
# `graph_owl_query::term` is the one place `FlakeValue <-> oxrdf::Term`
# conversion lives (SPARQL query results need it too) — reused rather than
# duplicated, per this project's standing rule against two copies of one
# mapping.
graph-owl-query = { path = "../graph-owl-query", version = "0.1.0" }
thiserror.workspace = true
serde.workspace = true
# `rdf-12` — Epic 94 Slice B/C, needed for `Term::Triple` (the `<< s p o >>`
# literal a reified relationship serializes to) and `BaseDirection`
# (`rdf:dirLangString`). **Enabling `oxrdf/rdf-12` directly is not enough**:
# `oxrdf`'s own feature only makes the variant *exist*; `oxttl`'s internal
# conversions are behind their own `#[cfg(feature = "rdf-12")]`, gated by
# `oxttl`'s *own* feature of the same name (which happens to also pull
# `oxrdf/rdf-12` in — redundant with the line below, kept anyway as the
# explicit statement of what this crate itself needs). Measured 7 August
# 2026: with only `oxrdf/rdf-12` set, `oxttl` itself fails to compile
# (`n3.rs`/`trig.rs` internal matches go non-exhaustive against a `Term`
# variant their own `#[cfg]`-gated arms were never told to expect).
oxrdf = { version = "0.3.3", features = ["rdf-12"] }
oxttl = { workspace = true, features = ["rdf-12"] }
oxjsonld = { workspace = true, features = ["rdf-12"] }
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
serde_json.workspace = true
# Blocking, not the workspace's async default: the allowlisted remote-context
# fetch (Slice B) is called from `RdfParser::parse`, a synchronous trait
# method with no runtime of its own. A caller already inside a tokio runtime
# must wrap the call in `spawn_blocking` — documented on the function itself.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
# Host extraction for the SSRF allowlist check (Slice B) — a hand-rolled
# split on a URL string is exactly the kind of parsing inconsistency SSRF
# bypasses exploit (userinfo tricks, IPv6 brackets, percent-encoding); `url`
# is the de-facto standard Rust URL parser (Servo project, MIT/Apache-2.0)
# and already resolves in this workspace's lockfile transitively.
url = "2"
