[package]
name = "graph-owl-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure domain types for graph-owl -- Flake, Sid, predicate vocabulary; zero I/O"
repository.workspace = true
keywords = ["knowledge-graph", "rdf", "domain-model"]

[dependencies]
utoipa.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true

# Test-only. A pack's `[[matching.blocking]]` is TOML, so the round-trip test
# for `blocking_strategy::Strategy`'s deserialization has to parse real TOML —
# asserting against a hand-built `serde_json::Value` would test a shape no pack
# ever writes. Kept out of `[dependencies]` because this crate is deliberately
# I/O- and format-free: the *strategies* are pure, and only their test reads a
# file format.
[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
