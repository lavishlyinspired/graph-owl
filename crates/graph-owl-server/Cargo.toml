[package]
name = "graph-owl-server"
version = "0.1.0"
edition.workspace = true
# Two binaries live here — the server and the contract generator — so `cargo
# run -p graph-owl-server` is ambiguous without this.
default-run = "graph-owl-server"
license.workspace = true

[dependencies]
utoipa.workspace = true
base64.workspace = true
graph-owl-api.workspace = true
graph-owl-reasoning = { path = "../graph-owl-reasoning" }
graph-owl-connectors.workspace = true
graph-owl-ui.workspace = true
graph-owl-authz.workspace = true
# Epic 14 + 32: the MCP surface, served over JSON-RPC at `POST /mcp`.
graph-owl-mcp.workspace = true
jsonwebtoken = "9"
graph-owl-core.workspace = true
graph-owl-storage.workspace = true
graph-owl-storage-postgres.workspace = true
graph-owl-engine-postgres.workspace = true
graph-owl-traversal.workspace = true
chrono.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
dotenvy.workspace = true
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
chrono.workspace = true
graph-owl-engine.workspace = true
jsonwebtoken = "9"
sqlx.workspace = true
tower.workspace = true
testcontainers-modules.workspace = true
testcontainers.workspace = true
hmac.workspace = true
sha2.workspace = true
# Epic 19 Slice A's end-to-end test needs a Kafka container alongside the
# Postgres one `testcontainers[-modules].workspace` already provides above —
# but that pin (0.23/0.11) has no `kafka` feature, and the version that does
# needs `testcontainers ^0.24`. Renamed via `package =`, the same way
# `graph-owl-connectors` avoids bumping the shared workspace pin (see
# `19-streaming.md` decision 6) — Cargo happily compiles two versions of one
# crate under different local names.
testcontainers-kafka = { package = "testcontainers", version = "0.24", features = [
    "reusable-containers",
] }
testcontainers-modules-kafka = { package = "testcontainers-modules", version = "0.12", features = [
    "kafka",
] }
# Test-only: producing a message directly, to prove consumption end to end.
# `graph-owl-connectors` depends on `rdkafka` itself but does not re-export
# it, so using its producer API here needs its own declaration.
rdkafka = "0.39"

[lints]
workspace = true
