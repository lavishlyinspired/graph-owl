[package]
name = "graph-owl-server"
version = "0.1.0"
edition.workspace = true
# Two binaries live here — the server and the contract generator — so `cargo
# run -p graph-owl-server` is ambiguous without this.
default-run = "graph-owl-server"
license.workspace = true

[features]
default = []
# Off by default (`00a`'s operational budget: the default footprint is the
# small one) — a second listening port, so a deployment that does not want
# one must be able to leave it out of the binary entirely, not merely
# unconfigured at runtime.
bolt = ["dep:graph-owl-bolt", "dep:async-trait", "dep:thiserror"]

[dependencies]
utoipa.workspace = true
base64.workspace = true
graph-owl-api.workspace = true
graph-owl-ontology = { path = "../graph-owl-ontology" }
# Epic 9a's export-authorization gap, closed: `GET /graph/export/{format}`
# returns `Catalog::export_*`'s output, and the JSON Graph format's schema
# (`JsonGraphView`) is registered in the OpenAPI contract, both of which need
# this crate's types named directly rather than only through `graph-owl-api`.
graph-owl-lpg-io = { path = "../graph-owl-lpg-io" }
# Bundles bulk-CSV export's multiple files (one per node label plus
# `relationships.csv`) into one HTTP download — the identical `tar`+`zstd`
# pairing `graph-owl-api::archive` already uses for the same "one response,
# many files" need, adopted here directly rather than reached for through
# that crate's own module, which is Epic 37b's catalog-backup format and a
# different concern from this export.
tar.workspace = true
zstd.workspace = true
# Epic 7d, decision 3: a second listening port, off unless a deployment asks
# for it. `optional = true` is what makes `cargo build --no-default-features`
# actually exclude the crate and everything it pulls in, not just skip
# calling it — see Slice F's dependency-tree assertion.
graph-owl-bolt = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
graph-owl-reasoning = { path = "../graph-owl-reasoning" }
# Epic 9 Slice B: the served, versioned JSON-LD `@context` route compacted
# output references by URL — `JsonLdContext::to_document()` is the same
# function `graph-owl-rdf-io`'s own serializer compacts against.
graph-owl-rdf-io = { path = "../graph-owl-rdf-io" }
graph-owl-connectors.workspace = true
graph-owl-ui.workspace = true
graph-owl-authz.workspace = true
# Epic 14 + 32: the MCP surface, served over JSON-RPC at `POST /mcp`.
graph-owl-mcp.workspace = true
jsonwebtoken = "9"
graph-owl-core.workspace = true
graph-owl-storage.workspace = true
graph-owl-storage-postgres.workspace = true
graph-owl-engine-postgres.workspace = true
graph-owl-traversal.workspace = true
chrono.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
dotenvy.workspace = true
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
chrono.workspace = true
graph-owl-engine.workspace = true
# Epic 37a: the scale-budget tests reuse Slice A's real corpus generator
# rather than inventing a second one. A dev-dependency cycle with
# graph-owl-cli (whose own tests already depend back on this crate to get a
# real server to restore into) is fine — dev-dependencies are per-package
# test-only edges, not part of the linked graph, so Cargo does not treat
# this as circular.
graph-owl-cli = { path = "../graph-owl-cli" }
jsonwebtoken = "9"
sqlx.workspace = true
tower.workspace = true
testcontainers-modules.workspace = true
testcontainers.workspace = true
hmac.workspace = true
sha2.workspace = true
# Epic 19 Slice A's end-to-end test needs a Kafka container alongside the
# Postgres one `testcontainers[-modules].workspace` already provides above —
# but that pin (0.23/0.11) has no `kafka` feature, and the version that does
# needs `testcontainers ^0.24`. Renamed via `package =`, the same way
# `graph-owl-connectors` avoids bumping the shared workspace pin (see
# `19-streaming.md` decision 6) — Cargo happily compiles two versions of one
# crate under different local names.
testcontainers-kafka = { package = "testcontainers", version = "0.24", features = [
    "reusable-containers",
] }
testcontainers-modules-kafka = { package = "testcontainers-modules", version = "0.12", features = [
    "kafka",
] }
# Test-only: producing a message directly, to prove consumption end to end.
# `graph-owl-connectors` depends on `rdkafka` itself but does not re-export
# it, so using its producer API here needs its own declaration.
rdkafka = "0.39"
# Epic 37a Slice F: the soak test's own RSS-growth assertion needs the test
# binary's process memory, cross-platform (CI is Linux, local dev is macOS).
# Checked via `00l-build-vs-adopt.md`'s crates.io process before adding: MIT,
# 179M downloads, last published 9 Jul 2026 — hand-rolling `/proc/self/status`
# parsing would also silently not work on macOS, where local dev-loop sanity
# runs of this test actually happen.
sysinfo = "0.39"
rand.workspace = true

[lints]
workspace = true
