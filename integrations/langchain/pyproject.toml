[project]
name = "graph-owl-langchain"
version = "0.1.0"
description = "LangChain and LangGraph adapters over graph-owl: a retriever, a toolkit, and a checkpointer — never a chain, an agent, or a runtime. See plans/43-framework-integrations.md and 00j-language-boundaries.md."
requires-python = ">=3.10"
# Decision 8 (framework-agnostic core, thin framework shims): the core talks
# MCP/REST and renders graph context to text. It has no reason to import
# LangChain, and a user who only wants the core must not be forced to
# install it. Stdlib only in `_core`, matching `graph-owl-sdk`'s own choice
# for the same reason — a consumer's dependency set is theirs to pick, not
# ours to grow.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
langgraph = ["langgraph>=0.2"]
# `dev` pulls in both framework extras rather than just the test tooling:
# the suite exercises GraphOwlRetriever, GraphOwlToolkit and
# GraphOwlCheckpointer directly (not only `_core`), so a `pip install
# .[dev]` that could not import langchain_core/langgraph would fail the
# suite it is meant to run — CI and a contributor's first checkout both
# install this one extra rather than three.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mutmut>=3",
    "ruff>=0.6",
    "mypy>=1.10",
    "langchain-core>=0.2",
    "langgraph>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graph_owl_langchain*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["graph_owl_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
