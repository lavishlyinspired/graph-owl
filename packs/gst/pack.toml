# GST — purchase-register vs GSTR-2B reconciliation.
#
# The first *real* domain pack, and the one the platform was designed against
# (`.claude/docs/referencePlans/markdown/CA-GST/18-gst-reconciliation-demo.md`).
#
# **Read this beside `packs/hospitality/pack.toml`.** The two share no
# vocabulary, no legal spine, no identifier scheme and no subject matter — and
# they configure the *same* blocking strategies, land through the same loader,
# and render through the same console queue. That identity is the whole claim
# of `plans/105-domain-neutrality.md`, and these two files are how it is
# checked rather than asserted.
#
# Licensing: every term here is drawn from the published GST statute and
# return formats, which are the specification. No implementation was read —
# `plans/00i-licensing.md` rule 2.

[pack]
id = "gst"
namespace = "https://graph-owl.dev/packs/gst#"
prefix = "gst"
description = "Input-tax-credit reconciliation: purchase register against GSTR-2B."

# Registered as an Epic 33 `OntologyPack` (the platform doc's decision 10: a
# domain pack's vocabulary half *is* an OntologyPack, not a parallel
# mechanism) so the console's Vocabulary browser shows these terms the same
# way it shows any other pack's. `permissive` because every term is derived
# from the published statute and return formats, which are the specification
# — nothing here is a third party's proprietary vocabulary.
[glossary]
path = "glossary.ttl"
version = "1"
source_url = "packs/gst/glossary.ttl"
licence_kind = "permissive"
licence_name = "Public domain — Government of India GST statute and return specification"

[[documents]]
path = "ontology.ttl"
source = "gst-ontology"

[[documents]]
path = "law/sections.ttl"
source = "gst-law"

[[documents]]
path = "law/rule-36-4.ttl"
source = "gst-law-rule-36-4"

[[documents]]
path = "fixtures/events.ttl"
source = "gst-events"

[[documents]]
path = "fixtures/purchase-register.ttl"
source = "gst-purchase-register"

[[documents]]
path = "fixtures/gstr2b.ttl"
source = "gst-gstr2b"

# **A second period as a second document, not more rows in the first.** A
# GSTR-2B is a monthly statement generated once; two periods in one file would
# model something that does not exist, and each import landing in its own
# named graph is what lets a query ask *which* period's 2B carried an invoice.
[[documents]]
path = "fixtures/gstr2b-2026-08.ttl"
source = "gst-gstr2b-2026-08"

# The third evidence source — Plan 108. What the supplier declared, as
# distinct from what the authority made available.
[[documents]]
path = "fixtures/gstr1.ttl"
source = "gst-gstr1"

[[documents]]
path = "fixtures/goods-receipt.ttl"
source = "gst-goods-receipt"

# Plan 107 Slice 1 (`plans/107-filing-period.md`). One `gst:FilingPeriod`
# instance per distinct `gst:period` value already used across every
# other fixture above — see the file's own comment for how that set was
# counted, not invented.
[[documents]]
path = "fixtures/filing-periods.ttl"
source = "gst-filing-periods"

# **The identical strategies the hospitality pack uses, over different
# fields.** `normalized` there matched a phone number; here it matches an
# invoice number. `composite` pairs it with a date window, because two systems
# rarely record the same invoice on the same day.
# Every predicate the pack asserts. `value_type` 1 is a string — amounts are
# strings here on purpose: a monetary value parsed into a float at the graph
# boundary would lose the exactness a tax figure needs, and the reconciliation
# compares them as decimals rather than as IEEE doubles.
[[predicates]]
name = "label"

[[predicates]]
name = "comment"

[[predicates]]
name = "supplierGstin"

[[predicates]]
name = "invoiceNumber"

# The normalized key every finding rule joins on — see `ontology.ttl`.
[[predicates]]
name = "invoiceKey"

[[predicates]]
name = "invoiceDate"

[[predicates]]
name = "taxableValue"

[[predicates]]
name = "taxAmount"

[[predicates]]
name = "period"

[[predicates]]
name = "itcAvailable"

[[predicates]]
name = "reverseCharge"

# The tax components the authority reports separately. The register carries one
# figure and reconciliation compares that, but an intra-state supply reported as
# inter-state is a real and common error the total alone hides completely — so
# the components are kept as evidence a reviewer can act on.
[[predicates]]
name = "igst"

[[predicates]]
name = "cgst"

[[predicates]]
name = "sgst"

[[predicates]]
name = "cess"

# When the supplier actually submitted the return declaring an invoice —
# Plan 108. Distinct from `invoiceDate`, and the field that turns "filed late"
# from an inference into a fact a reviewer can read off the finding.
[[predicates]]
name = "filedDate"

[[predicates]]
name = "pulledOn"

# GSTR-3B Table 4 — literal figures on the period's own return subject.
[[predicates]]
name = "itcAvailable4A"

[[predicates]]
name = "itcReversed4B1"

[[predicates]]
name = "itcReversed4B2"

[[predicates]]
name = "itcNet4C"

[[predicates]]
name = "itcReclaimed4D1"

[[predicates]]
name = "itcUnavailable4D2"

# Plan 123 Slice H.
[[predicates]]
name = "claimDeadline"

[[predicates]]
name = "exemptTurnover"

[[predicates]]
name = "totalTurnover"

[[predicates]]
name = "supplierName"

[[predicates]]
name = "invoiceType"

[[predicates]]
name = "placeOfSupply"

[[predicates]]
name = "effectiveFrom"

[[predicates]]
name = "capPercent"

[[predicates]]
name = "citation"

# `onInvoice` points at another subject rather than carrying a value — the
# edge that makes an event traversable back to what it happened to.
[[predicates]]
name = "onInvoice"
value_type = 0

[[predicates]]
name = "atTime"

[[predicates]]
name = "amount"

[[predicates]]
name = "governedBy"
value_type = 0

# `gst:Supplier` was declared in the ontology and never instantiated — every
# invoice carried its GSTIN as a bare literal. This edge is what closes that
# gap: `issuedBy` points at a real Supplier subject, traversable the way
# `onInvoice`/`governedBy` already are. See `plans/105c-gst-causal-graph.md`.
[[predicates]]
name = "issuedBy"
value_type = 0

# The canonical-entity edges — Plan 109 Slice 2. All point from the
# canonical `gst:Invoice` down to the per-source evidence record.
[[predicates]]
name = "recordedIn"
value_type = 0

[[predicates]]
name = "appearsIn"
value_type = 0

[[predicates]]
name = "reflectedIn"
value_type = 0

# GSTR-2A — Plan 123 Slice C. `observedIn` is the canonical invoice's edge to
# a 2A line; `seenIn` is that line's edge to the pull it was read in. Both are
# refs (value_type = 0); `pulledOn` is the literal date of the pull.
[[predicates]]
name = "observedIn"
value_type = 0

[[predicates]]
name = "seenIn"
value_type = 0

[[predicates]]
name = "filedIn"
value_type = 0

[[predicates]]
name = "filedBy"
value_type = 0

[[predicates]]
name = "generatedFor"
value_type = 0

# The edge `gst:FilingPeriod` exists for — Plan 107 Slice 1
# (`plans/107-filing-period.md`). Points at a `FilingPeriod` subject,
# traversable the way `issuedBy`/`onInvoice` already are; the pre-existing
# `period` predicate above is untouched and stays a plain literal.
[[predicates]]
name = "belongsToPeriod"
value_type = 0

[[predicates]]
name = "generatedDate"

# Merged in from ext-apps/Reco's own extension pack, 16 August 2026 —
# genuine GST-document fields a real purchase-register/GSTR-2B consumer
# needed that this pack was simply missing, not one integrator's
# customization. See ontology.ttl's comment on these six for the
# per-field reasoning.
[[predicates]]
name = "hsnCode"

[[predicates]]
name = "imsStatus"

[[predicates]]
name = "noteType"

[[predicates]]
name = "originalInvoiceNumber"

[[predicates]]
name = "voucherType"

[[predicates]]
name = "voucherNumber"

[[matching.blocking]]
strategy = "normalized"
fields = ["gst:supplierGstin", "gst:invoiceNumber"]

[[matching.blocking]]
strategy = "composite"

[[matching.blocking.of]]
strategy = "normalized"
fields = ["gst:supplierGstin"]

[[matching.blocking.of]]
strategy = "date_window"
fields = ["gst:invoiceDate"]
days = 7

# A transposed GSTIN is the classic data-entry error, and neither an exact nor
# a normalized key can see through it — the two strings share no prefix. This
# is the case `NGram` exists for.
[[matching.blocking]]
strategy = "ngram"
fields = ["gst:supplierGstin"]
n = 3

# **Every strategy above keys a *supplier*, and every finding this pack raises
# is about an *invoice*** — so until Plan 111 Slice F ran them against a real
# finding's subject, blocking could never fire on one. Found by wiring the
# candidates into the evidence panel and getting an empty list for a scenario
# that plainly has a near-miss in it.
#
# `ngram` rather than `normalized`: the reconciliation's own join already
# matches identical invoice numbers, so a normalized key adds nothing it does
# not already have. What no exact join can see is a *mistyped* number —
# `INV-1014` against `INV-10I4`, `RST/2026/0455` against `RST/2026/455` — and
# a shared-window key is what surfaces it as one pair to look at rather than
# two unrelated exceptions.
[[matching.blocking]]
strategy = "ngram"
fields = ["gst:invoiceNumber"]
n = 3

# **A finding rule is a query plus a binding, and nothing else.** `query` names
# a `[[queries]]` entry, `subject` names the variable holding the graph subject
# the finding is about, and `evidence` says which predicate each remaining
# binding came from.
#
# The evidence mapping is written out rather than inferred from the variable
# name, because a variable is named for the reader of the query and a predicate
# is named by the ontology — `?claimed` is not `gst:taxAmount`, and a runtime
# that guessed would file evidence citing a predicate that does not exist.
# A reviewer follows evidence back into the graph; evidence that cannot be
# followed is worse than none, because it looks checkable and is not.
#
# Two rules carry an extra band — `[findings.similarity]` and `[findings.span]`
# — for the two things SPARQL cannot do here. Both are declared in the manifest
# rather than hidden in the runtime, so the thresholds are visible to whoever
# has to defend a finding.
#
# **`priority` — Epic 105 P10 (`plans/119-architecture-audit.md` §10).** Most
# rules carry one: which rule wins when more than one fires on the same
# subject, for a consumer that has to collapse several findings into a single
# decision (reco-now's one-row-per-invoice table is the motivating case — an
# invoice can be both filed-but-absent-from-2B and genuinely mismatched
# against what was filed, and one of the two has to win the row). Lower is
# more actionable. graph-owl's own console has no such constraint — every
# finding is its own row there — so this is read, never required, and
# `gst:PaymentOverdue` (payment-timing tracking, not a documents-disagree
# conclusion) deliberately carries none.
#
#   1  the two sides genuinely disagree on a value, or credit is matched but
#      blocked/reversed/mis-keyed — the most actionable class, something is
#      concretely wrong with what was claimed
#   2  claimed, and not yet available for one of three reasons GSTR-1/2A
#      evidence distinguishes (never filed, filed but not yet in 2B, or —
#      absent GSTR-1 entirely — simply not reached)
#   3  the opposite direction: the authority has evidence the books do not,
#      which is unclaimed credit rather than an over-claim — an opportunity,
#      not a risk, and the reason it ranks last

# **Narrowed by Plan 108 Slice 3.** This is the books-vs-2B answer, and it
# stands down entirely once GSTR-1 evidence is loaded, because the two rules
# below then say which of its two causes applies. See the query's own comment
# — the guard is global rather than per-invoice on purpose.
[[findings]]
label = "gst:PotentialMismatch"
summary = "An invoice claimed in the purchase register that has not reached GSTR-2B (no GSTR-1 data loaded to say why)"
governed_by = "gst:Section16-2-aa"
query = "missing-in-gstr2b"
priority = 2
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
]

# The delta is judged against the cap in force **on the invoice date**, read
# from `law/rule-36-4.ttl` by traversal. The citation is projected into the
# evidence so a reviewer sees which notification the judgement was made under
# — a finding that cannot name its authority is not defensible.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Claimed, not available in GSTR-2B"
meaning = "This invoice is in your books and in no GSTR-2B. No GSTR-1/2A data is loaded, so nothing here can say whether the supplier filed it."
next_action = "Upload the GSTR-2A for this period — it separates 'the supplier never filed' from 'they filed and it did not reach you'."
tone = "danger"
category = "follow-up"

[[findings]]
label = "gst:AmountMismatch"
summary = "Both sides report the invoice, and the values differ by more than the cap then in force allowed"
governed_by = "gst:Rule36-4"
query = "amount-mismatch"
priority = 1
subject = "purchase"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxableValue", var = "claimed" },
  { predicate = "gst:taxableValue", var = "filed" },
  { predicate = "gst:capPercent", var = "capPercent" },
  { predicate = "gst:citation", var = "citation" },
]

# Both of the next two are findings on invoices where **every number agrees**
# — which is the point. Matching is necessary and not sufficient, and a
# reconciliation that stopped at amounts would pass both of these silently.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Your books and GSTR-2B disagree"
meaning = "Both sides report the invoice and the values differ by more than the cap in force allowed."
next_action = "Compare against the physical invoice, then correct whichever side is wrong."
tone = "warning"
category = "data"

[[findings]]
label = "gst:ITCNotAvailable"
summary = "The invoice matches, and the authority reports the credit as unavailable"
governed_by = "gst:Section17-5"
query = "itc-not-available"
priority = 1
# A 2B that carries no ITC-eligibility flag at all cannot tell this rule which
# credits the authority has blocked. Zero findings would then read as "no
# blocked credit", when the truth is that eligibility was never stated.
requires = ["https://graph-owl.dev/packs/gst#itcAvailable"]
subject = "purchase"
evidence = [
  # The query already selects `?gstin`; binding it means a blocked-credit
  # finding names the supplier whose credit is blocked. Without it the finding
  # identified an invoice number and nothing else, and a consumer joining on
  # (supplier, invoice) dropped it — two invoices blocked under s.17(5) were
  # reported as matched with zero blocked ITC.
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:itcAvailable", var = "itcAvailable" },
]

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Credit reported as unavailable"
meaning = "The invoice matches perfectly and the authority reports the credit as not available."
next_action = "Check whether it falls under Section 17(5) blocked credits. Do not claim it on the strength of the match alone."
tone = "danger"
category = "compliance"

[[findings]]
label = "gst:Reversed"
summary = "The invoice matches, and the authority flags it as reverse-charge"
governed_by = "gst:Section16-2-aa"
query = "reverse-charge"
priority = 1
subject = "purchase"
evidence = [
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:reverseCharge", var = "reverseCharge" },
]

# **Surfaced, never auto-merged.** An erroneous merge silently attributes one
# supplier's invoice to another and is far harder to detect afterwards than
# the work of reviewing a candidate. The band is measured against this pack's
# own fixture, not chosen by feel: the planted transposition scores 0.619 at
# n=3 and the nearest genuinely different supplier scores 0.065, so 0.40 sits
# in the middle of the widest available gap.
#
# `at_most` is the load-bearing half. Without it every *correctly* matched
# invoice scores 1.0 and is reported as a suspected typo — the finding that
# would make a reviewer stop trusting the queue on day one.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Flagged as reverse charge"
meaning = "The invoice matches and the authority flags it as reverse-charge, so the tax is yours to self-assess."
next_action = "Confirm the tax has been paid under RCM before taking the credit."
tone = "info"
category = "compliance"

[[findings]]
label = "gst:GstinTransposition"
summary = "Same invoice number and period on both sides under near-identical GSTINs — probably a keying error"
governed_by = "gst:MatchingPolicy"
query = "gstin-transposition"
priority = 1
subject = "purchase"
evidence = [
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:supplierGstin", var = "claimedGstin" },
  { predicate = "gst:supplierGstin", var = "filedGstin" },
  { predicate = "gst:period", var = "period" },
]

[findings.similarity]
strategy = "ngram"
n = 3
left = "claimedGstin"
right = "filedGstin"
at_least = 0.40
at_most = 0.999
# Epic 105 P7's near-miss half (plans/105g-evidence-provenance-and-near-miss.md).
# The traversal walk from this finding's own subject has no edge to the
# supplier `right`'s GSTIN actually belongs to — that missing edge is the
# entire premise of this rule — so the second Supplier is resolved by value
# instead: the graph subject whose own gst:supplierGstin equals `right`'s
# bound value. A full IRI, not the pack's usual curie shorthand, because this
# is the one field in this band that runs a real graph query rather than
# comparing two strings.
resolve_by = "https://graph-owl.dev/packs/gst#supplierGstin"

# ── Plan 108: the three-way reconciliation ──────────────────────────────────
#
# **Five rules, and each one names a different next action.** That is the whole
# claim of `plans/108-books-gstr1-gstr2b-reconciliation.md`: "unmatched" is not
# a finding, it is four findings a CA has to tell apart by hand. With GSTR-1 in
# the graph the runtime tells them apart instead — chase the supplier, chase
# the mapping, fix the books, record the purchase, or wait for the goods.
#
# Every one of them is pack content. No Rust, no loader change, no new console
# component: a `[[findings]]` entry naming a `.sparql` file and a statute
# subject a reviewer can traverse to and read.

# Books has it; no supplier has declared it anywhere. Cites the same section
# `PotentialMismatch` does — verified present in `law/sections.ttl`, not
# assumed — because it is the same statutory condition, read at the stage
# where the graph can now say which side has not met it.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Near-identical GSTIN — probably a keying error"
meaning = "Two records agree on invoice number and period under GSTINs that differ by what looks like a transposition. Nothing has been merged."
next_action = "Confirm which GSTIN is right and correct the register. Merging automatically would attribute one supplier's invoice to another."
tone = "warning"
category = "data"

[[findings]]
label = "gst:SupplierNotFiled"
summary = "An invoice claimed in the purchase register that the supplier has not reported in any GSTR-1/IFF filing"
governed_by = "gst:Section16-2-aa"
query = "missing-in-gstr1"
priority = 2
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:invoiceDate", var = "invoiceDate" },
]

# The supplier filed it and it reached no GSTR-2B. `filedDate` is projected
# because it is usually the whole explanation — an invoice filed after a
# period's 2B was generated cannot be in it, and a reviewer should be able to
# see that without asking anybody.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Supplier has not filed"
meaning = "You have booked this purchase and no supplier has declared it in any GSTR-1 or IFF."
next_action = "Chase the supplier to file it. Do not claim the credit until it appears in a GSTR-2B."
tone = "danger"
category = "follow-up"

[[findings]]
label = "gst:Gstr1NotIn2b"
summary = "The supplier declared the invoice in GSTR-1/IFF, and it has not reached any GSTR-2B this pack holds"
governed_by = "gst:Section16-2-aa"
query = "gstr1-not-in-2b"
priority = 2
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:filedDate", var = "filedDate" },
  { predicate = "gst:period", var = "declaredPeriod" },
]

# The reverse direction — and the one finding here that can be worth money
# rather than cost it. `gst:Section16` rather than `16(2)(aa)`: this is a
# completeness question about the recipient's own records, not a question
# about whether the supplier furnished details. The subject is the *declared*
# invoice, because there is no register row to point at — that absence is the
# finding.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Filed by the supplier, not in your GSTR-2B"
meaning = "The supplier did declare it — the filing date is on the finding — but it has reached none of the GSTR-2B statements loaded here."
next_action = "Check the GSTIN they filed against and whether it went in as B2C. If they simply filed late, it should appear in a later period's 2B."
tone = "warning"
category = "follow-up"

[[findings]]
label = "gst:MissingInBooks"
summary = "The supplier's declared invoice appears in GSTR-1/IFF with no matching entry in the purchase register"
governed_by = "gst:Section16"
query = "missing-in-books"
priority = 3
subject = "declared"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxableValue", var = "taxableValue" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:invoiceDate", var = "invoiceDate" },
]

# Same cap logic as `AmountMismatch`, against a different named graph — so the
# citation still travels with the row and a 2020 invoice inside the cap then
# in force stays silent.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "In the GST records, not in your books"
meaning = "A supplier has declared an invoice against your GSTIN that your purchase register does not carry."
next_action = "Find out whether the purchase was never recorded — this is credit you may be entitled to and have not claimed — or whether somebody filed against the wrong GSTIN."
tone = "info"
category = "data"

[[findings]]
label = "gst:BooksGstr1Mismatch"
summary = "The purchase register and the supplier's GSTR-1/IFF declare the same invoice with different values"
governed_by = "gst:Rule36-4"
query = "books-gstr1-mismatch"
priority = 1
subject = "purchase"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxableValue", var = "claimed" },
  { predicate = "gst:taxableValue", var = "declaredValue" },
  { predicate = "gst:capPercent", var = "capPercent" },
  { predicate = "gst:citation", var = "citation" },
]

# **Every document agrees and the credit is still not claimable yet.** The one
# rule here that is not a document comparison — see the query's own comment,
# and `gst:Section16-2-b`, the one genuinely new statute subject this plan
# adds.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Your books and the supplier's filing disagree"
meaning = "Both sides declare this invoice and the values differ by more than the cap in force allowed."
next_action = "Compare against the physical invoice. One of the two is wrong, and the finding names both figures."
tone = "warning"
category = "data"

[[findings]]
label = "gst:GoodsReceiptTiming"
summary = "The invoice is matched and its GSTR-2B period contains it, but the goods or services were received in a later period"
governed_by = "gst:Section16-2-b"
query = "goods-receipt-timing"
priority = 1
# No goods-receipt records means no receipt dates to compare against the
# period, so the rule cannot say whether anything arrived late. Silence here
# would read as "everything arrived in time".
requires = ["https://graph-owl.dev/packs/gst#GoodsReceipt"]
subject = "purchase"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  # The credit this defers. Without it a working paper cannot size the
  # s.16(2)(b) deduction and must either skip it or subtract zero — both of
  # which overstate what is claimable this period.
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:period", var = "period" },
  { predicate = "gst:atTime", var = "receivedAt" },
]

# **The error a total-only reconciliation cannot see, by construction.** Every
# total agrees and the tax sits under the wrong head — ITC is claimed head-wise
# in GSTR-3B, so credit taken under the wrong head is a real reversal exposure.
# The head-wise figures were already being imported as evidence with no rule
# reading them; this is that rule.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Goods received after the period"
meaning = "Every document agrees and the credit is still not claimable in this period, because the goods or services arrived in a later one."
next_action = "Defer the claim to the period the goods were received in. Section 16(2)(b) is a condition in its own right."
tone = "warning"
category = "compliance"

[[findings]]
label = "gst:TaxHeadMismatch"
summary = "The invoice matches on every total, and the tax is split across different heads than the supplier filed"
governed_by = "gst:Section16-2-aa"
query = "tax-head-mismatch"
priority = 1
subject = "purchase"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:igst", var = "bookedIgst" },
  { predicate = "gst:igst", var = "filedIgst" },
]

# **The same legal entity, a different state registration.** Not a typo — both
# GSTINs are valid and belong to one taxpayer, so this is neither
# `GstinTransposition` (a keying error) nor a value mismatch (nothing is wrong
# with the figures). Cites the matching policy rather than a statute, because
# the judgement is this pack's own: which registration the supply actually came
# from is a question for a human. Plan 109.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Totals agree, tax heads do not"
meaning = "Every total matches and the tax sits under different heads than the supplier filed — inter-state against intra-state."
next_action = "ITC is claimed head-wise in GSTR-3B, so correct the head before claiming. Credit under the wrong head is a reversal exposure with interest."
tone = "danger"
category = "data"

[[findings]]
label = "gst:SupplierPanMismatch"
summary = "Booked against one GSTIN of a supplier and filed under another registration of the same PAN"
governed_by = "gst:MatchingPolicy"
query = "supplier-pan-mismatch"
priority = 1
subject = "invoice"
evidence = [
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:supplierGstin", var = "bookedGstin" },
  { predicate = "gst:supplierGstin", var = "filedGstin" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
]

# The 180-day condition, as a span between two events.
#
# `when_missing = "elapsed"`, not `"finding"`. Treating every unpaid invoice
# as overdue was a real defect caught while writing `eval/questions.md`: an
# invoice issued last week and not yet paid is not in breach, and flagging it
# fills the queue with accusations about data that is simply not due. Elapsed
# time from the purchase is what the section actually turns on.
#
# `as_of` because a statutory reconciliation is run as of a filing date rather
# than "now" — and because a fixture judged against the wall clock silently
# changes meaning as the calendar moves, which would turn a passing test into
# a failing one on a date nobody chose.

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "A different state registration of the same supplier"
meaning = "Booked against one GSTIN and filed under another registration sharing the same PAN — both are valid, and one is the wrong one for this supply."
next_action = "Decide which registration the supply actually came from. It changes the place of supply, and therefore which heads the tax belongs under."
tone = "warning"
category = "data"

# --- Plan 123 Slice H: the checks nothing else in this pack performs -----

[[findings]]
label = "gst:DuplicateClaim"
summary = "The same invoice is claimed twice in the purchase register"
governed_by = "gst:DuplicatePolicy"
query = "duplicate-claim"
# The most urgent kind of finding here: credit taken twice is an excess claim,
# and unlike a mismatch it is entirely the taxpayer's own doing.
priority = 0
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
]

[findings.guidance]
title = "Same invoice claimed twice"
meaning = "Two rows in your purchase register carry the same invoice number for the same supplier, so the credit has been taken twice. It usually happens by accident — one purchase entered under two voucher numbers, or a file re-imported after a correction."
next_action = "Delete one of the two entries and reduce the claim. An excess claim carries interest under s.50 and a demand under s.73/74, and this one is entirely your own record to fix."
tone = "danger"
category = "data"

[[findings]]
label = "gst:CreditNoteNotInPortal"
summary = "The books applied a credit note that no GSTR-2B this pack holds carries"
governed_by = "gst:Section34"
query = "credit-note-not-in-portal"
priority = 2
# Without a note in the register there is nothing to check. Silence would
# otherwise read as "every note agrees with the portal".
requires = ["https://graph-owl.dev/packs/gst#noteType"]
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:noteType", var = "noteType" },
  { predicate = "gst:originalInvoiceNumber", var = "originalInvoice" },
]

[findings.guidance]
title = "Credit note you applied, supplier has not"
meaning = "You have reduced your credit for a note the supplier has not declared. Your position is the safe one — you have claimed less than the portal supports — but the two sides will keep disagreeing about this invoice until the note itself is reconciled."
next_action = "Ask the supplier to declare the credit note, or confirm they issued it against a different invoice."
tone = "warning"
category = "follow-up"

[[findings]]
label = "gst:ImsNotActioned"
summary = "An IMS record left unactioned will be deemed accepted at the cut-off"
governed_by = "gst:ImsPolicy"
query = "ims-not-actioned"
priority = 1
# A deployment that never ingested IMS data would otherwise report every
# invoice as about to be deemed accepted — a screen of urgent findings
# manufactured out of missing data.
requires = ["https://graph-owl.dev/packs/gst#imsStatus"]
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:imsStatus", var = "imsStatus" },
]

[findings.guidance]
title = "Waiting on you — will be accepted by default"
meaning = "This record is sitting in the Invoice Management System with no decision. If you do nothing before the cut-off it is treated as accepted, and its credit flows into your GSTR-2B on that basis. Silence is a decision here, and it is the only one that gets made without anyone choosing it."
next_action = "Accept or reject it before the cut-off. If it is genuinely yours, accepting deliberately costs nothing; if it is not, rejecting is the only way to keep it out."
tone = "warning"
category = "compliance"

[[findings]]
label = "gst:ReverseChargeContradiction"
summary = "A reverse-charge invoice the supplier has also declared in GSTR-2B"
governed_by = "gst:Section16-2-aa"
query = "reverse-charge-claimed-as-forward"
priority = 1
requires = ["https://graph-owl.dev/packs/gst#reverseCharge"]
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:reverseCharge", var = "reverseCharge" },
]

[findings.guidance]
title = "Reverse charge, but the supplier also charged tax"
meaning = "You are self-assessing tax on this invoice under reverse charge, and the supplier has also declared forward tax on it in their own return. One of the two treatments is wrong, and both parties have already acted on their own."
next_action = "Establish which treatment is correct with the supplier. If theirs is, stop self-assessing; if yours is, they need to amend."
tone = "danger"
category = "compliance"

[[findings]]
label = "gst:ItcTimeBarApproaching"
summary = "Credit for this invoice is still unclaimed and the s.16(4) window is set"
governed_by = "gst:Section16-4"
query = "itc-time-bar-approaching"
priority = 0
# The deadline is read from the FilingPeriod, never computed here — s.16(4)'s
# date moves with the annual return's filing date, so a period with no
# declared deadline cannot be judged rather than assumed to be open.
requires = ["https://graph-owl.dev/packs/gst#claimDeadline"]
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:period", var = "period" },
  { predicate = "gst:claimDeadline", var = "deadline" },
]

[findings.guidance]
title = "Credit still unclaimed, and the window closes"
meaning = "This invoice has not reached any GSTR-2B and the deadline for claiming it is set. Section 16(4) closes on the earlier of 30 November following the financial year, or the day you file your annual return — so filing GSTR-9 early closes it early."
next_action = "Chase the supplier now. After the deadline the credit is gone regardless of who was at fault."
tone = "danger"
category = "compliance"

[[findings]]
label = "gst:ProportionateReversalDue"
summary = "The period declares exempt turnover, so a Rule 42/43 reversal is due"
governed_by = "gst:Rule42"
query = "proportionate-reversal-due"
priority = 1
requires = ["https://graph-owl.dev/packs/gst#exemptTurnover"]
# The only rule in this pack whose subject is a period rather than an invoice.
# The reversal is computed on the period's turnover split, so there is no one
# invoice to point at.
subject = "filingPeriod"
evidence = [
  { predicate = "gst:period", var = "period" },
  { predicate = "gst:exemptTurnover", var = "exemptTurnover" },
  { predicate = "gst:totalTurnover", var = "totalTurnover" },
]

[findings.guidance]
title = "Exempt turnover — a reversal is due"
meaning = "This period declares exempt or non-business turnover, so only the taxable share of common credit is available. The reversal is computed on the period turnover, not on any single invoice, which is why it is reported against the period."
next_action = "Compute the Rule 42/43 reversal from your own turnover figures and report it in Table 4B(1). This tool deliberately does not compute the amount — the inputs are yours."
tone = "warning"
category = "compliance"

# --- GSTR-2A: what the portal has said since the 2B froze — Plan 123 Slice C

[[findings]]
label = "gst:FiledLateInGstr2a"
summary = "The portal now shows the invoice in GSTR-2A, and it reached no GSTR-2B this pack holds"
governed_by = "gst:Section16-2-aa"
query = "filed-late-in-gstr2a"
# Ranked above `gst:Gstr1NotIn2b` (priority 2): both say "declared but not
# claimable", and this one says it on the authority's own evidence rather than
# the supplier's, so it is the one to act on where both fire.
priority = 1
# **Declared, not inferred.** With no 2A loaded this rule returns no rows, and
# "no rows" here would otherwise read as "no supplier filed late" — the exact
# false clean this pack's three-state outcome exists to prevent. `Gstr2aInvoice`
# rather than `Gstr2aSnapshot`: a snapshot with no lines is a pull that found
# nothing, which is a real answer, but with no *lines* anywhere the rule had
# no input at all.
requires = ["https://graph-owl.dev/packs/gst#Gstr2aInvoice"]
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:pulledOn", var = "pulledOn" },
  { predicate = "gst:period", var = "observedPeriod" },
]

[findings.guidance]
title = "Supplier filed late — after your 2B froze"
meaning = "The portal now shows this invoice in GSTR-2A and it reached no GSTR-2B. That means the supplier filed after the 2B you claimed against was generated, or filed against the wrong GSTIN."
next_action = "The credit is not lost — it should appear in a later 2B. Confirm with the supplier which period they filed for, and claim it there."
tone = "warning"
category = "follow-up"

[[findings]]
label = "gst:AmendedAfterClaim"
summary = "The portal's own value has changed since the GSTR-2B this claim was made against"
governed_by = "gst:Section16-2-aa"
query = "amended-after-claim"
priority = 1
requires = ["https://graph-owl.dev/packs/gst#Gstr2aInvoice"]
subject = "invoice"
evidence = [
  { predicate = "gst:supplierGstin", var = "gstin" },
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:taxAmount", var = "claimedAmount" },
  { predicate = "gst:taxAmount", var = "observedAmount" },
  { predicate = "gst:pulledOn", var = "pulledOn" },
]

[findings.guidance]
title = "Portal value changed after you claimed"
meaning = "The supplier amended this invoice after the GSTR-2B your claim rests on was frozen. Your filed position is now out of date through no error of yours, and the difference is what a reassessment would land on."
next_action = "Check the amended value against your books and adjust in the current period. Keep the original 2B — it is what your earlier claim legitimately rested on."
tone = "warning"
category = "compliance"

[[findings]]
label = "gst:PaymentOverdue"
summary = "Credit taken on an invoice not paid within 180 days of its date"
governed_by = "gst:Section16-2-d"
query = "payment-overdue"
# Without purchase events there is nothing to measure 180 days *from*, and the
# rule returns no rows — which must not be read as "everything was paid on
# time". `gst:PaymentEvent` is deliberately **not** required: the query holds
# it in an OPTIONAL block, because an invoice with no payment at all is
# precisely what this rule is looking for.
requires = ["https://graph-owl.dev/packs/gst#PurchaseEvent"]
subject = "purchase"
evidence = [
  { predicate = "gst:invoiceNumber", var = "number" },
  { predicate = "gst:supplierGstin", var = "gstin" },
  # Without this the reversal has no size, and a consumer computing a net ITC
  # position must either deduct zero or drop the line — both of which
  # overstate what is claimable.
  { predicate = "gst:taxAmount", var = "taxAmount" },
  { predicate = "gst:atTime", var = "purchasedAt" },
  { predicate = "gst:atTime", var = "paidAt" },
]

[findings.span]
from = "purchasedAt"
to = "paidAt"
exceeds_days = 180
when_missing = "elapsed"
as_of = "2026-08-01"

# Written for the person who has to act on this, which is a different
# sentence from `summary` — that one is written for a reviewer of the rule.
[findings.guidance]
title = "Unpaid past 180 days"
meaning = "Credit was taken on an invoice the supplier has not been paid for within 180 days of its date."
next_action = "Reverse the credit, or pay the supplier. Section 16(2)(d) leaves no third option."
tone = "danger"
category = "compliance"

