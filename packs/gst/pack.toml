[console]

# **What this pack looks like on the reconciliation page — declared here, not
# in the console.** The page's shape is domain-neutral: sources in, rules run,
# a statement out, exceptions to work. Everything below names GST, and a
# healthcare, banking or automotive pack declares its own instead. A pack that
# declares no `[console.reconciliation]` simply does not appear on that page,
# which is the correct answer rather than an error — the hospitality pack has
# never had one.
[console.reconciliation]
label = "GST reconciliation"
subtitle = "Your books against what your suppliers declared and what the authority made available — with the reason for every difference."
# Formatting is a domain fact too: a GST working paper grouped 1,000,000 reads
# as wrong before it reads as foreign.
currency = "INR"
locale = "en-IN"
# What "the same record" means here, and what a human calls one. Both are
# predicate names in this pack's own vocabulary.
match_key = "invoiceKey"
identity = "invoiceNumber"
record_noun = "invoice"


# The figures the statement totals, in the order every practitioner
# reconciliation format lists them. A pack reconciling something other than tax
# declares its own — quantities, claim amounts, whatever has to agree.
measures = [
  { name = "taxableValue", label = "Taxable value" },
  { name = "igst", label = "IGST" },
  { name = "cgst", label = "CGST" },
  { name = "sgst", label = "SGST" },
  { name = "cess", label = "Cess" },
  { name = "taxAmount", label = "Total tax", total = true },
]

# **Which predicate carries each thing the page needs**, so the console builds
# its query from the pack's own vocabulary instead of `gst:` compiled into
# TypeScript. A healthcare pack names `claimNumber`/`memberId`; a banking one
# names `reference`/`counterparty`. The console knows the *roles*, never the
# names.
[console.reconciliation.fields]
date = "invoiceDate"
period = "period"
party = "issuedBy"
party_id = "supplierGstin"
party_name = "supplierName"

# **Ordered the way the reconciliation is actually performed.** `role` says
# which side of the statement a source is: `opening` is what the taxpayer
# claims, `closing` is what the statement reconciles *to*, and `evidence`
# explains differences without being a balance of its own.
[[console.reconciliation.sources]]
key = "books"
class = "PurchaseInvoice"
label = "Your books"
description = "What you have recorded"
surface = "books"
role = "opening"

[[console.reconciliation.sources]]
key = "gstr1"
class = "Gstr1Invoice"
label = "GSTR-2A / GSTR-1"
description = "What your suppliers declared"
surface = "gstr1"
role = "evidence"

[[console.reconciliation.sources]]
key = "authority"
class = "Gstr2bInvoice"
label = "GSTR-2B"
description = "What credit the authority made available"
surface = "gstr2b"
role = "closing"

[[console.queues]]
id = "gst-reconciliation"
label = "GST reconciliation"
source = "findings"
labels = [
  "gst:PotentialMismatch",
  "gst:AmountMismatch",
  "gst:ITCNotAvailable",
  "gst:Reversed",
  "gst:GstinTransposition",
  "gst:PaymentOverdue",
  # Plan 108. One line each — the queue renderer is generic per pack, so a
  # new finding costs a config entry rather than a component.
  "gst:SupplierNotFiled",
  "gst:Gstr1NotIn2b",
  "gst:MissingInBooks",
  "gst:BooksGstr1Mismatch",
  "gst:GoodsReceiptTiming",
  "gst:TaxHeadMismatch",
  "gst:SupplierPanMismatch",
]
actions = ["accept", "reject-with-reason", "defer"]
evidence = "side-by-side"


# **The files this pack knows how to read — Plan 111 Slice E.**
#
# These lived in `ui/src/features/packs/packSurfaces.ts` as a TypeScript
# constant, so a second domain's upload surfaces needed a React change. The
# *prose* is the pack's: what the file is called, why it matters, and where to
# download it are domain facts and belong beside the domain's ontology.
#
# `format` names a reader the console implements — a parser cannot be declared
# in TOML, and that is the honest boundary of this mechanism. A pack naming a
# format this console has no reader for is refused with that format named,
# never rendered as a surface that accepts a file and then cannot parse it.
#
# **Ordered the way the reconciliation is actually done**, not alphabetically:
# your books first, then what your suppliers declared, then what the authority
# made available. A CA reads down the list and it is the workflow.
[[console.imports]]
key = "books"
label = "Purchase register (your books)"
description = "What you have recorded. Everything else is reconciled against this, so it is the one to load first."
format = "csv"
accept = ".csv,.tsv,.txt,text/csv"
how_to_obtain = """
Export the purchase register from your accounting system as CSV — in Tally, Display → Account Books → Purchase Register → Export (CSV). It needs at least a supplier GSTIN, invoice number, invoice date and taxable value; tax columns (IGST/CGST/SGST/Cess) and a reverse-charge column are used when present.\
"""

[[console.imports]]
key = "gstr1"
label = "GSTR-2A / GSTR-1 (what your suppliers declared)"
description = "What your suppliers reported to GST. This is what separates 'the supplier never filed it' from 'they filed it and it never reached you' — two problems with opposite next actions."
format = "gstr1-json"
accept = "application/json,.json"
how_to_obtain = """
Download it from the GST portal: Returns Dashboard → select the period → GSTR-2A → Download JSON. GSTR-2A carries what your suppliers declared in their GSTR-1, which is exactly what this compares against.\
"""

[[console.imports]]
key = "gstr2b"
label = "GSTR-2B (what credit is available)"
description = "The authority's own statement of the credit available to you for a period. This is what gates the claim."
format = "gstr2b-json"
accept = "application/json,.json"
how_to_obtain = """
Download it from the GST portal: Returns Dashboard → select the period → GSTR-2B → Download JSON. A response saved from a GSP API works too — the two are the same document.\
"""
